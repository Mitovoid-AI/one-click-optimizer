# Builds and publishes a GitHub Release whenever a version tag is pushed:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The release gets OneClickOptimizer-Setup.exe (installer), OneClickOptimizer.exe
# (portable), oneclick-cli.exe and SHA256SUMS.txt. Installed apps find the new
# release through the GitHub API and offer "Update now / Skip / Later".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml says v$v but the tag is ${{ github.ref_name }}" }

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/OneClickOptimizer.exe dist/OneClickOptimizer-Setup.exe
          Copy-Item target/release/OneClickOptimizer.exe dist/OneClickOptimizer.exe
          Copy-Item target/release/oneclick-cli.exe dist/oneclick-cli.exe
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "What's new" comes from this version's section in CHANGELOG.md.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## ${{ github.ref_name }}\s*\r?\n(.*?)(?=^## |\z)")
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "- Improvements and fixes" }
          $notes = @"
          ## What's new
          $changes

          ---

          **Download OneClickOptimizer-Setup.exe** and double-click it to install (no admin needed).
          Already installed? The app offers this update automatically.

          | File | What it is |
          |---|---|
          | OneClickOptimizer-Setup.exe | Installer (Start menu, desktop shortcut, tray watch, uninstall from Settings) |
          | OneClickOptimizer.exe | Portable app, runs without installing |
          | oneclick-cli.exe | Command-line report |
          | SHA256SUMS.txt | Checksums the app uses to verify updates |

          Windows SmartScreen may warn because the app isn't code-signed yet: click **More info** then **Run anyway**.
          "@
          gh release create "${{ github.ref_name }}" dist/* --title "OneClick Optimizer ${{ github.ref_name }}" --notes $notes --generate-notes
