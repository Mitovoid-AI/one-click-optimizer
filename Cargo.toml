[package]
name = "oneclick-optimizer"
version = "0.5.0"
edition = "2021"
description = "OneClick Optimizer: a tiny Windows app that finds what slows your PC, explains it, and fixes it in one click."
license-file = "legal/EULA.txt"
publish = false

[lib]
name = "optimizer"
path = "src/lib.rs"

# Window, tray watch + popup, and the elevated helper (no console window).
[[bin]]
name = "OneClickOptimizer"
path = "src/bin/oneclick.rs"

# Text / JSON report for terminals and scripts.
[[bin]]
name = "oneclick-cli"
path = "src/bin/oneclick-cli.rs"

[features]
# Offline fake store for testing the Pro flow (never used for releases).
license-mock = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
